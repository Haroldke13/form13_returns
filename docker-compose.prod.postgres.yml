services:
  host-route-setup:
    build:
      context: .
    container_name: form14_host_route_setup
    profiles:
      - route-setup
    environment:
      PBORA_APP_HOST_IP: ${PBORA_APP_HOST_IP:-auto}
      PBORA_GATEWAY: ${PBORA_GATEWAY:-auto}
      PBORA_NETWORK_INTERFACE: ${PBORA_NETWORK_INTERFACE:-auto}
      PBORA_ROUTE_CIDR: ${PBORA_ROUTE_CIDR:-10.107.0.0/19}
      PBORA_ROUTE_PREFIX: ${PBORA_ROUTE_PREFIX:-19}
      PBORA_ASSIGN_HOST_IP: ${PBORA_ASSIGN_HOST_IP:-0}
      PBORA_REPLACE_LAN_ROUTE: ${PBORA_REPLACE_LAN_ROUTE:-1}
      PBORA_REPLACE_DEFAULT_ROUTE: ${PBORA_REPLACE_DEFAULT_ROUTE:-1}
      PBORA_ROUTE_DRY_RUN: ${PBORA_ROUTE_DRY_RUN:-0}
    network_mode: host
    cap_add:
      - NET_ADMIN
    privileged: true
    entrypoint:
      - /app/scripts/configure_host_routes.sh
    restart: "no"

  web:
    build:
      context: .
    container_name: form14_web
    env_file:
      - .env.production
    environment:
      PORT: ${PORT:-8000}
      SSL_CERTFILE: /app/certs/server.crt
      SSL_KEYFILE: /app/certs/server.key
      HOST_PORT: ${HOST_PORT:-8000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-360}
      EXTERNAL_POSTGRES: ${EXTERNAL_POSTGRES:-1}
      INTERNAL_DATABASE_URL: ${INTERNAL_DATABASE_URL:-postgresql+psycopg2://pbora:pbora@host-gateway:5432/pbora}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://pbora:pbora@host-gateway:5432/pbora}
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DB_HOST: ${DB_HOST:-host-gateway}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pbora}
      DB_USER: ${DB_USER:-pbora}
      DB_PASSWORD: ${DB_PASSWORD:-pbora}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      POSTGRES_HOST: ${POSTGRES_HOST:-host-gateway}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-pbora}
      POSTGRES_USER: ${POSTGRES_USER:-pbora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pbora}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      RUN_SCHEMA_SYNC_ON_STARTUP: ${RUN_SCHEMA_SYNC_ON_STARTUP:-1}
    ports:
      - "${DOCKER_BIND_IP:-0.0.0.0}:${HOST_PORT:-8000}:8000"
    volumes:
      - ./instance:/app/instance
      - ./backups:/app/backups
      - ./certs:/app/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s = socket.create_connection(('127.0.0.1', 8000), 5); s.close()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
