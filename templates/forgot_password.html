{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h4 mb-2">Reset Password</h2>
          <p class="text-muted mb-4">Enter your login email to receive a reset link.</p>
          <form method="post">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="text" class="form-control" id="email" name="email" placeholder="e.g., aabdullahi or aabdullahi@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
          </form>
          <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="small">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
