{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 720px; margin: 48px auto; padding: 24px;">
    <h2 style="margin-bottom: 20px;">Sign Up</h2>

    <div class="alert alert-warning" role="alert" style="margin-bottom: 20px;">
        New account registration is currently disabled.
    </div>

    <form method="post" class="card" style="padding: 24px; border-radius: 14px;">
        <div class="form-group" style="margin-bottom: 16px;">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" disabled>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" disabled>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" disabled>
        </div>

        <p class="text-muted" style="margin-bottom: 18px;">
            Password must be at least 8 characters and include uppercase, lowercase, a number, and a special character.
        </p>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <button type="submit" class="btn btn-primary" disabled>Create Account</button>
            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Back to Login</a>
        </div>
    </form>
</div>
{% endblock %}
