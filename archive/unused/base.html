    <style>
      /* Subtle fade/slide-in animation for hero and cards */
      .fade-in {
        opacity: 0;
        transform: translateY(30px);
        animation: fadeInUp 1s cubic-bezier(.23,1.01,.32,1) forwards;
      }
      .fade-in.delay-1 { animation-delay: 0.2s; }
      .fade-in.delay-2 { animation-delay: 0.4s; }
      .fade-in.delay-3 { animation-delay: 0.6s; }
      @keyframes fadeInUp {
        to { opacity: 1; transform: none; }
      }
      /* Progress bar styles */
      .progress-bar-fixed {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 6px;
        background: linear-gradient(90deg, #2563eb 0%, #22d3ee 100%);
        z-index: 2000;
        box-shadow: 0 2px 8px #2563eb22;
        transition: width 0.2s;
      }
        .scroll-btn {
          position: fixed;
          right: 32px;
          width: 52px; height: 52px;
          border-radius: 50%;
          background: linear-gradient(135deg, #2563eb 60%, #22d3ee 100%);
          color: #fff;
          border: none;
          box-shadow: 0 2px 12px #2563eb22;
          font-size: 2rem;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          z-index: 2001;
          opacity: 0.88;
          transition: background 0.2s, opacity 0.2s;
          touch-action: manipulation;
        }
        .scroll-btn:hover, .scroll-btn:focus { opacity: 1; background: #2563eb; outline: 2px solid #22d3ee; }
        .scroll-btn.top { bottom: 96px; }
        .scroll-btn.bottom { bottom: 36px; }
        @media (max-width: 600px) {
          .scroll-btn {
            right: 10px;
            width: 44px; height: 44px;
            font-size: 1.3rem;
            box-shadow: 0 1px 6px #2563eb22;
          }
          .scroll-btn.top { bottom: 70px; }
          .scroll-btn.bottom { bottom: 18px; }
        }
    </style>
    <script>
      // Animate on load
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.fade-in').forEach(el => {
          el.style.visibility = 'visible';
        });
      });
      // Progress bar logic
      window.addEventListener('scroll', () => {
        const bar = document.getElementById('progress-bar-fixed');
        if (!bar) return;
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width = percent + '%';
      });
      // Scroll to top/bottom
      function scrollToTop() { window.scrollTo({top:0,behavior:'smooth'}); }
      function scrollToBottom() { window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }
    </script>

    <style>
        /* ================================
           GLOBAL RESET & BASE STYLES
           ================================ */
        *,
        *::before,
        *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: "Inter", "Segoe UI", Arial, sans-serif;
          font-size: 16px;
          line-height: 1.5;
          background-color: #f4f6f8;
          color: #1f2937;
          padding: 20px;
        }

        /* ================================
           FORM CONTAINER
           ================================ */
        /* Unified main content wrapper for all pages */
        .main-content-wrapper {
          width: 100vw;
          min-height: 100vh;
          box-sizing: border-box;
          padding: 100px;
          background: #fff;
          border-radius: 32px;
          box-shadow: 0 8px 40px 0 rgba(0,0,0,0.15), 0 1.5px 8px 0 rgba(0,0,0,0.08);
          margin: 0 auto;
          overflow-x: auto;
          display: flex;
          flex-direction: column;
        }
        @media (max-width: 1024px) {
          .main-content-wrapper {
            padding: 40px 10px 40px 10px;
            border-radius: 18px;
          }
        }
        @media (max-width: 600px) {
          .main-content-wrapper {
            padding: 12px 2vw 12px 2vw;
            border-radius: 10px;
          }
          h1, h2, h3, h4, h5, h6 {
            font-size: 1.1em !important;
            word-break: break-word;
          }
          .info-cards, .card-container {
            flex-direction: column !important;
            gap: 18px !important;
          }
          .info-card, .card {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            padding: 18px 8px !important;
          }
          .hero-section {
            padding: 24px 4vw 18px 4vw !important;
            min-height: 180px !important;
          }
          .cta-btn, .scroll-btn {
            font-size: 1rem !important;
            padding: 12px 18px !important;
            min-width: 44px;
            min-height: 44px;
          }
          input, select, textarea, button {
            font-size: 1em !important;
            padding: 10px 8px !important;
            min-width: 44px;
            min-height: 44px;
          }
        }

        form {
          width: 100%;
          max-width: 100%;
          background: transparent;
          padding: 0;
          border-radius: 0;
          box-shadow: none;
        }

        form h1,
        form h2,
        form h3 {
          margin-bottom: 20px;
          font-weight: 600;
          color: #0f172a;
        }

        /* ================================
           FIELD GROUPS & ROWS
           ================================ */
        .form-group,
        .form-row {
          margin-bottom: 18px;
        }

        @media (min-width: 768px) {
          .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
          }
        }

        /* ================================
           LABELS
           ================================ */
        label {
          display: block;
          font-size: 14px;
          font-weight: 600;
          margin-bottom: 6px;
          color: #334155;
        }

        label span.required {
          color: #dc2626;
          margin-left: 4px;
        }

        /* ================================
           INPUTS, SELECTS, TEXTAREAS
           ================================ */
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
          width: 100%;
          padding: 10px 12px;
          font-size: 15px;
          border-radius: 6px;
          border: 1px solid #cbd5e1;
          background-color: #ffffff;
          color: #0f172a;
          transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea {
          min-height: 110px;
          resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
          color: #94a3b8;
          font-size: 14px;
        }

        /* ================================
           FOCUS & ACCESSIBILITY
           ================================ */
        input:focus,
        select:focus,
        textarea:focus {
          outline: none;
          border-color: #2563eb;
          box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* ================================
           VALIDATION STATES (OPTIONAL)
           ================================ */
        .input-error,
        input:invalid,
        select:invalid,
        textarea:invalid {
          border-color: #dc2626;
        }

        .input-success {
          border-color: #16a34a;
        }

        /* ================================
           CHECKBOXES & RADIOS
           ================================ */
        input[type="checkbox"],
        input[type="radio"] {
          margin-right: 6px;
          transform: scale(1.1);
        }

        .checkbox-group,
        .radio-group {
          display: flex;
          gap: 14px;
          flex-wrap: wrap;
        }

        /* ================================
           BUTTONS
           ================================ */
        button,
        input[type="submit"] {
          background-color: #2563eb;
          color: #ffffff;
          font-size: 16px;
          font-weight: 600;
          border: none;
          border-radius: 8px;
          padding: 12px 18px;
          cursor: pointer;
          transition: background-color 0.2s ease, transform 0.1s ease,
            box-shadow 0.1s ease;
        }

        button:hover,
        input[type="submit"]:hover {
          background-color: #1e40af;
        }

        button:active,
        input[type="submit"]:active {
          transform: translateY(1px);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 600px) {
          button,
          input[type="submit"] {
            width: 100%;
          }
        }

        /* ================================
           HELPER TEXT & TOOLTIPS
           ================================ */
        .help-text,
        small {
          display: block;
          margin-top: 4px;
          font-size: 13px;
          color: #64748b;
        }

        /* ================================
           TABLES (IF YOUR FORM HAS TABLE SECTIONS)
           ================================ */
        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 20px;

        table th,

    <script>
    const initRequiredWrappers = () => {
      document.querySelectorAll("input[required], select[required], textarea[required]")
        .forEach((field) => {
          const fieldType = (field.type || "").toLowerCase();
          if (["radio", "checkbox", "hidden"].includes(fieldType)) return;
          if (field.closest(".radio-wrapper, .checkbox-wrapper")) return;
          if (field.parentElement.classList.contains("required-wrapper")) return;

          const wrapper = document.createElement("div");
          wrapper.className = "required-wrapper";

          field.parentNode.insertBefore(wrapper, field);
          wrapper.appendChild(field);

          const star = document.createElement("span");
          star.textContent = "*";
          star.className = "required-asterisk";

          wrapper.appendChild(star);
        });
    };

    window.initRequiredWrappers = initRequiredWrappers;

    document.addEventListener("DOMContentLoaded", () => {
      initRequiredWrappers();
    });
    </script>

<script>
  const STORAGE_KEY = "floatingActionsPosition";
  
  const savePosition = (id, left, top) => {
    const positions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    positions[id] = { left, top };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
  };
  
  const loadPosition = (id) => {
    const positions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return positions[id];
  };
  
  const makeDraggableWithPersist = (button) => {
    if (!button || button.dataset.draggable === "true") return;
    button.dataset.draggable = "true";
    
    const savedPos = loadPosition(button.id);
    if (savedPos) {
      button.style.position = "fixed";
      button.style.left = `${savedPos.left}px`;
      button.style.top = `${savedPos.top}px`;
      button.style.right = "auto";
      button.style.bottom = "auto";
    }
    
    let startX = 0;
    let startY = 0;
    let originLeft = 0;
    let originTop = 0;
    const minTouchDistance = 10;
    let touchDistance = 0;

    const onPointerMove = (event) => {
      touchDistance = Math.sqrt(
        Math.pow(event.clientX - startX, 2) + Math.pow(event.clientY - startY, 2)
      );
      
      if (touchDistance < minTouchDistance) return;
      
      const nextLeft = originLeft + (event.clientX - startX);
      const nextTop = originTop + (event.clientY - startY);
      button.style.left = `${nextLeft}px`;
      button.style.top = `${nextTop}px`;
    };

    const onPointerUp = (event) => {
      if (touchDistance >= minTouchDistance) {
        const finalLeft = parseInt(button.style.left, 10);
        const finalTop = parseInt(button.style.top, 10);
        savePosition(button.id, finalLeft, finalTop);
      }
      button.releasePointerCapture?.(event.pointerId);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", onPointerUp);
    };

    button.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();

      const rect = button.getBoundingClientRect();
      startX = event.clientX;
      startY = event.clientY;
      originLeft = rect.left;
      originTop = rect.top;
      touchDistance = 0;

      button.style.position = "fixed";
      button.style.right = "auto";
      button.style.bottom = "auto";
      button.style.left = `${originLeft}px`;
      button.style.top = `${originTop}px`;

      button.setPointerCapture?.(event.pointerId);
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
    });
  };
  
  // Initialize draggable buttons on load
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".floating-action-btn").forEach(makeDraggableWithPersist);
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const toggle = document.getElementById("accessibility-toggle");
    const panel = document.getElementById("accessibility-panel");
    const scrollToBottom = document.getElementById("scroll-to-bottom");
    const scrollToTop = document.getElementById("scroll-to-top");
    const floatingActions = document.querySelector(".floating-actions");
    const navbar = document.querySelector(".navbar");
    const rootStyle = document.documentElement.style;
    const state = {
      fontScale: 1,
    };

    const resetVisualClasses = () => {
      document.body.classList.remove(
        "a11y-grayscale",
        "a11y-high-contrast",
        "a11y-negative-contrast",
        "a11y-light-background",
        "a11y-dark-background",
        "a11y-links-underline",
        "a11y-readable-font"
      );
      state.fontScale = 1;
      rootStyle.setProperty("--a11y-font-scale", state.fontScale);
    };

    const positionFloatingActions = () => {
      if (!floatingActions || !navbar || window.innerWidth <= 768) return;
      const navbarBottom = navbar.getBoundingClientRect().bottom + window.scrollY;
      const firstButton = floatingActions.querySelector("button");
      const buttonHeight = firstButton ? firstButton.offsetHeight : 48;
      const gapValue = parseFloat(getComputedStyle(floatingActions).gap) || 12;
      const offsetTop = navbarBottom + 25 - (buttonHeight + gapValue);
      floatingActions.style.top = `${Math.max(offsetTop, navbarBottom + 10)}px`;
    };

    window.refreshFloatingActions = positionFloatingActions;

    const makeDraggable = (button) => {
      if (!button || button.dataset.draggable === "true") return;
      button.dataset.draggable = "true";
      let startX = 0;
      let startY = 0;
      let originLeft = 0;
      let originTop = 0;

      const onPointerMove = (event) => {
        const nextLeft = originLeft + (event.clientX - startX);
        const nextTop = originTop + (event.clientY - startY);
        button.style.left = `${nextLeft}px`;
        button.style.top = `${nextTop}px`;
      };

      const onPointerUp = () => {
        button.releasePointerCapture?.(button.pointerId || 0);
        window.removeEventListener("pointermove", onPointerMove);
        window.removeEventListener("pointerup", onPointerUp);
      };

      button.addEventListener("pointerdown", (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        event.preventDefault();

        const rect = button.getBoundingClientRect();
        startX = event.clientX;
        startY = event.clientY;
        originLeft = rect.left;
        originTop = rect.top;

        button.style.right = "auto";
        button.style.bottom = "auto";
        button.style.left = `${originLeft}px`;
        button.style.top = `${originTop}px`;

        button.setPointerCapture?.(event.pointerId);
        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp);
      });
    };

    toggle.addEventListener("click", () => {
      const isHidden = panel.hasAttribute("hidden");
      if (isHidden) {
        panel.removeAttribute("hidden");
      } else {
        panel.setAttribute("hidden", "");
      }
      toggle.setAttribute("aria-expanded", String(isHidden));
    });

    panel.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLButtonElement)) return;
      const action = target.getAttribute("data-a11y-action");
      if (!action) return;

      switch (action) {
        case "increase-text":
          state.fontScale = Math.min(state.fontScale + 0.1, 1.6);
          rootStyle.setProperty("--a11y-font-scale", state.fontScale.toFixed(2));
          break;
        case "decrease-text":

          rootStyle.setProperty("--a11y-font-scale", state.fontScale.toFixed(2));
          break;
        case "grayscale":
          document.body.classList.toggle("a11y-grayscale");
          break;
        case "high-contrast":
          document.body.classList.toggle("a11y-high-contrast");
          document.body.classList.remove(
            "a11y-negative-contrast",
            "a11y-light-background",
            "a11y-dark-background"
          );
          break;
        case "negative-contrast":
          document.body.classList.toggle("a11y-negative-contrast");
          document.body.classList.remove(
            "a11y-high-contrast",
            "a11y-light-background",
            "a11y-dark-background"
          );
          break;
        case "light-background":
          document.body.classList.toggle("a11y-light-background");
          document.body.classList.remove(
            "a11y-high-contrast",
            "a11y-negative-contrast",
            "a11y-dark-background"
          );
          break;
        case "dark-background":
          document.body.classList.toggle("a11y-dark-background");
          document.body.classList.remove(
            "a11y-high-contrast",
            "a11y-negative-contrast",
            "a11y-light-background"
          );
          break;
        case "links-underline":
          document.body.classList.toggle("a11y-links-underline");
          break;
        case "readable-font":
          document.body.classList.toggle("a11y-readable-font");
          break;
        case "reset":
          resetVisualClasses();
          break;
        default:
          break;
      }
    });

    scrollToBottom.addEventListener("click", () => {
      window.scrollTo({
        top: document.documentElement.scrollHeight,
        behavior: "smooth",
      });
    });

    scrollToTop.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth",
      });
    });

    positionFloatingActions();
    window.addEventListener("resize", positionFloatingActions);

    document.querySelectorAll(".floating-action-btn").forEach(makeDraggable);
  });
</script>
<script>
  (() => {
    let updateTimer = null;

    const runAutoUpdate = () => {
      if (window.initRequiredWrappers) {
        window.initRequiredWrappers();
      }
      if (window.refreshFloatingActions) {
        window.refreshFloatingActions();
      }
    };

    const scheduleUpdate = () => {
      if (updateTimer) return;
      updateTimer = window.setTimeout(() => {
        updateTimer = null;
        runAutoUpdate();
      }, 50);
    };

    ["click", "input", "keydown"].forEach((eventName) => {
      document.addEventListener(eventName, scheduleUpdate, true);
    });
  })();
</script>
</body>
</html>
